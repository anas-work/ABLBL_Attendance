services:
  postgres:
    image: postgres:15-alpine
    container_name: attendance_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=attendance_db
      - TZ=Asia/Kolkata
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  recognition_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_recognition_engine
    restart: always
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/attendance_db
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Kolkata
      - LD_LIBRARY_PATH=/usr/local/lib/python3.10/dist-packages/nvidia/cudnn/lib:/usr/local/lib/python3.10/dist-packages/nvidia/cublas/lib:/usr/local/lib/python3.10/dist-packages/nvidia/cuda_nvrtc/lib:/usr/local/cuda/lib64
    command: ["python3", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "9001", "--ssl-keyfile", "config/ssl.key", "--ssl-certfile", "config/ssl.crt"]
    ports:
      - "0.0.0.0:9001:9001"
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts
      - ./Employees_Photo:/app/Employees_Photo
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
